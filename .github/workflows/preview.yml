name: Deploy Vercel Preview

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Name of the prebuilt Vercel output artifact
        required: true
        type: string
      pr_head_sha:
        description: Pull request head commit
        required: true
        type: string
      pr_number:
        description: Pull request number
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: vercel-preview-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy preview artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: preview
    outputs:
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout trusted deployment tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: trusted-tooling
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.15.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: trusted-tooling/pnpm-lock.yaml

      - name: Install trusted deployment tooling
        working-directory: trusted-tooling
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download prebuilt output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.artifact_name }}
          path: deployment/.vercel/output

      - name: Deploy prebuilt artifact
        id: deploy
        working-directory: deployment
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.MISCVERCELHOSTING }}
        run: |
          deployment_url="$(../trusted-tooling/node_modules/.bin/vercel deploy --prebuilt --token="$VERCEL_TOKEN" | tail -n 1)"
          if [[ ! "$deployment_url" =~ ^https://[a-zA-Z0-9.-]+\.vercel\.app$ ]]; then
            echo "Vercel returned an invalid deployment URL." >&2
            exit 1
          fi
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

  comment:
    name: Update preview comment
    if: always()
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      DEPLOYMENT_URL: ${{ needs.deploy.outputs.url }}
      DEPLOYMENT_OUTCOME: ${{ needs.deploy.result }}
      COMMIT: ${{ inputs.pr_head_sha }}
      PR_NUMBER: ${{ inputs.pr_number }}

    steps:
      - name: Update preview comment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const marker = '<!-- misc-vercel-preview -->';
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const commit = process.env.COMMIT;
            const shortCommit = commit.slice(0, 7);
            const commitUrl = `${context.serverUrl}/${owner}/${repo}/commit/${commit}`;
            const url = process.env.DEPLOYMENT_URL;
            const validUrl = /^https:\/\/[a-zA-Z0-9.-]+\.vercel\.app$/.test(url);

            const succeeded = process.env.DEPLOYMENT_OUTCOME === 'success' && validUrl;
            const body = succeeded
              ? `${marker}\n### Vercel preview ready\n\nDeployed [\`${shortCommit}\`](${commitUrl}) to [${url}](${url}).`
              : `${marker}\n### Vercel preview failed\n\nThe preview for [\`${shortCommit}\`](${commitUrl}) did not deploy. [View the failed workflow run](${runUrl}).`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
