name: Deploy Cloudflare Preview

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Name of the prebuilt Cloudflare output artifact
        required: true
        type: string
      pr_head_sha:
        description: Pull request head commit
        required: true
        type: string
      pr_number:
        description: Pull request number
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: cloudflare-preview-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy preview artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: preview
    outputs:
      url: ${{ steps.preview-url.outputs.url }}

    steps:
      - name: Checkout trusted deployment tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: trusted-tooling
          sparse-checkout: |
            .github/deployment/package.json
            .github/deployment/pnpm-lock.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.15.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: trusted-tooling/.github/deployment/pnpm-lock.yaml

      - name: Install trusted deployment tooling
        working-directory: trusted-tooling/.github/deployment
        run: pnpm install --frozen-lockfile --prod --ignore-scripts

      - name: Download prebuilt output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: deployment/dist

      - name: Upload preview version
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_OUTPUT_FILE_PATH: deployment/wrangler-output.ndjson
        run: trusted-tooling/.github/deployment/node_modules/.bin/wrangler versions upload --config deployment/dist/server/wrangler.json --name misc-astro --preview-alias pr-${{ inputs.pr_number }}

      - name: Read preview URL
        id: preview-url
        shell: bash
        run: |
          preview_url="$(jq -er 'select(.type == "version-upload") | .preview_alias_url' deployment/wrangler-output.ndjson)"
          echo "url=$preview_url" >> "$GITHUB_OUTPUT"

  comment:
    name: Update preview comment
    if: always()
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: write
    env:
      DEPLOYMENT_URL: ${{ needs.deploy.outputs.url }}
      DEPLOYMENT_OUTCOME: ${{ needs.deploy.result }}
      COMMIT: ${{ inputs.pr_head_sha }}
      PR_NUMBER: ${{ inputs.pr_number }}

    steps:
      - name: Update preview comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = '<!-- misc-cloudflare-preview -->';
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const commit = process.env.COMMIT;
            const shortCommit = commit.slice(0, 7);
            const commitUrl = `${context.serverUrl}/${owner}/${repo}/commit/${commit}`;
            const url = process.env.DEPLOYMENT_URL;

            const succeeded = process.env.DEPLOYMENT_OUTCOME === 'success';
            const body = succeeded
              ? `${marker}\n### Cloudflare preview ready\n\nDeployed [\`${shortCommit}\`](${commitUrl}) to [${url}](${url}).`
              : `${marker}\n### Cloudflare preview failed\n\nThe preview for [\`${shortCommit}\`](${commitUrl}) did not deploy. [View the failed workflow run](${runUrl}).`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
