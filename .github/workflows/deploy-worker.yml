name: Deploy to Cloudflare

on:
  workflow_call:
    inputs:
      environment:
        description: Target environment (production or preview)
        required: true
        type: string
      artifact_name:
        description: Name of the prebuilt Cloudflare output artifact
        required: true
        type: string
      migrations_artifact_name:
        description: Name of the migrations artifact
        required: true
        type: string
      preview_alias:
        description: Preview alias for versions upload; empty means production deploy
        default: ''
        type: string
      pr_head_sha:
        description: Pull request head commit (preview only)
        default: ''
        type: string
      pr_number:
        description: Pull request number (preview only)
        default: 0
        type: number

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: cloudflare-deploy-${{ inputs.environment }}-pr-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }} artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: ${{ inputs.environment }}
    outputs:
      url: ${{ steps.preview-url.outputs.url }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Set up trusted Wrangler
        id: wrangler
        uses: ./.github/actions/setup-wrangler

      - name: Download prebuilt output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: deployment/dist

      - name: Download migrations
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.migrations_artifact_name }}
          path: deployment/migrations

      - name: Apply D1 migrations
        run: ${{ steps.wrangler.outputs.wrangler }} d1 migrations apply DB --remote --config deployment/dist/server/wrangler.json

      - name: Deploy to production
        if: inputs.preview_alias == ''
        run: ${{ steps.wrangler.outputs.wrangler }} deploy --config deployment/dist/server/wrangler.json

      - name: Upload preview version
        if: inputs.preview_alias != ''
        env:
          WRANGLER_OUTPUT_FILE_PATH: deployment/wrangler-output.ndjson
        run: ${{ steps.wrangler.outputs.wrangler }} versions upload --config deployment/dist/server/wrangler.json --preview-alias ${{ inputs.preview_alias }}

      - name: Read preview URL
        if: inputs.preview_alias != ''
        id: preview-url
        shell: bash
        run: |
          preview_url="$(jq -er 'select(.type == "version-upload") | .preview_alias_url' deployment/wrangler-output.ndjson)"
          echo "url=$preview_url" >> "$GITHUB_OUTPUT"

  comment:
    name: Update preview comment
    if: always() && inputs.preview_alias != ''
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: write
    env:
      DEPLOYMENT_URL: ${{ needs.deploy.outputs.url }}
      DEPLOYMENT_OUTCOME: ${{ needs.deploy.result }}
      COMMIT: ${{ inputs.pr_head_sha }}
      PR_NUMBER: ${{ inputs.pr_number }}

    steps:
      - name: Update preview comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = '<!-- misc-cloudflare-preview -->';
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const commit = process.env.COMMIT;
            const shortCommit = commit.slice(0, 7);
            const commitUrl = `${context.serverUrl}/${owner}/${repo}/commit/${commit}`;
            const url = process.env.DEPLOYMENT_URL;

            const succeeded = process.env.DEPLOYMENT_OUTCOME === 'success';
            const body = succeeded
              ? `${marker}\n### Cloudflare preview ready\n\nDeployed [\`${shortCommit}\`](${commitUrl}) to [${url}](${url}).`
              : `${marker}\n### Cloudflare preview failed\n\nThe preview for [\`${shortCommit}\`](${commitUrl}) did not deploy. [View the failed workflow run](${runUrl}).`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
