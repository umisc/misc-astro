name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - LICENSE
      - .gitignore

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare-content:
    name: Prepare content snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Reject pull requests from forks
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "CI only supports branches in ${GITHUB_REPOSITORY} because the content repository is private."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve pinned content commit
        id: content-ref
        shell: bash
        run: |
          entry="$(git ls-tree HEAD -- content)"
          read -r mode type sha path <<< "$entry"
          if [[ "$mode" != "160000" || "$type" != "commit" || "$path" != "content" || ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The content path must be a pinned git submodule commit." >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned content snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: umisc/website-content
          ref: ${{ steps.content-ref.outputs.sha }}
          path: content-snapshot
          ssh-key: ${{ secrets.MISC_CONTENT_DEPLOY_KEY }}
          persist-credentials: false

      - name: Remove content repository history
        run: rm -rf content-snapshot/.git

      - name: Upload content snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: content-${{ github.sha }}
          path: content-snapshot
          if-no-files-found: error
          retention-days: 1

  gates:
    name: Compute build gates
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      production: ${{ steps.gates.outputs.production }}
      preview: ${{ steps.gates.outputs.preview }}
    steps:
      - name: Compute gates
        id: gates
        run: |
          production=false
          preview=false
          if [ "${{ github.event_name }}" = "push" ]; then
            production=true
          elif [ "${{ github.event_name }}" = "pull_request" ] \
            && [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ] \
            && [ "${{ github.event.pull_request.user.login }}" != "dependabot[bot]" ] \
            && [ "${{ github.actor }}" != "dependabot[bot]" ]; then
            preview=true
          fi
          echo "production=$production" >> "$GITHUB_OUTPUT"
          echo "preview=$preview" >> "$GITHUB_OUTPUT"

  check-and-build:
    name: Check and build deployment artifact
    needs: [prepare-content, gates]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download content snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: content-${{ github.sha }}
          path: content

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.15.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --prod --audit-level critical

      - name: Run checks
        run: pnpm run ci

      - name: Build production output
        if: needs.gates.outputs.production == 'true'
        run: pnpm build:production

      - name: Upload production output
        if: needs.gates.outputs.production == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloudflare-output-prod-${{ github.run_id }}
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Build preview output
        if: needs.gates.outputs.preview == 'true'
        run: pnpm build:preview

      - name: Upload preview output
        if: needs.gates.outputs.preview == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloudflare-output-preview-${{ github.run_id }}
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Upload migrations
        if: needs.gates.outputs.production == 'true' || needs.gates.outputs.preview == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloudflare-migrations-${{ github.run_id }}
          path: migrations
          if-no-files-found: error
          retention-days: 1

  preview:
    name: Preview
    if: needs.gates.outputs.preview == 'true'
    needs: [check-and-build, gates]
    permissions:
      contents: read
      pull-requests: write # The reusable workflow updates one preview status comment.
    uses: umisc/misc-astro/.github/workflows/deploy-worker.yml@main
    secrets: inherit
    with:
      environment: preview
      artifact_name: cloudflare-output-preview-${{ github.run_id }}
      migrations_artifact_name: cloudflare-migrations-${{ github.run_id }}
      preview_alias: pr-${{ github.event.pull_request.number }}
      pr_head_sha: ${{ github.event.pull_request.head.sha }}
      pr_number: ${{ github.event.pull_request.number }}

  production:
    name: Production
    if: needs.gates.outputs.production == 'true'
    needs: [check-and-build, gates]
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-worker.yml
    secrets: inherit
    with:
      environment: production
      artifact_name: cloudflare-output-prod-${{ github.run_id }}
      migrations_artifact_name: cloudflare-migrations-${{ github.run_id }}
