name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare-content:
    name: Prepare content snapshot
    runs-on: ubuntu-latest

    steps:
      - name: Reject pull requests from forks
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "CI only supports branches in ${GITHUB_REPOSITORY} because the content repository is private."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve pinned content commit
        id: content-ref
        shell: bash
        run: |
          entry="$(git ls-tree HEAD -- content)"
          read -r mode type sha path <<< "$entry"
          if [[ "$mode" != "160000" || "$type" != "commit" || "$path" != "content" || ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The content path must be a pinned git submodule commit." >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned content snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: umisc/website-content
          ref: ${{ steps.content-ref.outputs.sha }}
          path: content-snapshot
          ssh-key: ${{ secrets.MISC_CONTENT_DEPLOY_KEY }}
          persist-credentials: false

      - name: Remove content repository history
        run: rm -rf content-snapshot/.git

      - name: Upload content snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: content-${{ github.sha }}
          path: content-snapshot
          if-no-files-found: error
          retention-days: 1

  check-and-build:
    name: Check and build deployment artifact
    needs: prepare-content
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download content snapshot
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: content-${{ github.sha }}
          path: content

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.15.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --prod --audit-level critical

      - name: Run checks
        run: pnpm run ci

      - name: Build Vercel output
        run: pnpm build

      - name: Upload Vercel output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vercel-output-${{ github.run_id }}
          path: .vercel/output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  preview:
    name: Preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == 'umisc/misc-astro' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.actor != 'dependabot[bot]'
    needs: check-and-build
    permissions:
      contents: read
      pull-requests: write # The reusable workflow updates one preview status comment.
    uses: umisc/misc-astro/.github/workflows/preview.yml@main
    with:
      artifact_name: vercel-output-${{ github.run_id }}
      pr_head_sha: ${{ github.event.pull_request.head.sha }}
      pr_number: ${{ github.event.pull_request.number }}
    secrets: inherit

  production:
    name: Production
    if: github.event_name == 'push'
    needs: check-and-build
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      artifact_name: vercel-output-${{ github.run_id }}
    secrets: inherit
