name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Reject pull requests from forks
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "CI only supports branches in ${GITHUB_REPOSITORY} because the content submodule is private."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load misc-content deploy key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.MISC_CONTENT_DEPLOY_KEY }}

      - name: Rewrite GitHub HTTPS URLs to SSH
        run: git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Checkout content submodule
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm run ci

  preview:
    name: Preview
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: check
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/preview.yml
    secrets: inherit

  production:
    name: Production
    if: github.event_name == 'push'
    needs: check
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
