name: Deploy to Vercel

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load misc-content deploy key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.MISC_CONTENT_DEPLOY_KEY }}

      - name: Rewrite GitHub HTTPS URLs to SSH
        run: git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Checkout content submodule
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Pull Vercel production configuration
        env:
          VERCEL_TOKEN: ${{ secrets.MISCVERCELHOSTING }}
        run: pnpm dlx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel artifacts
        env:
          VERCEL_TOKEN: ${{ secrets.MISCVERCELHOSTING }}
        run: pnpm dlx vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt artifacts
        env:
          VERCEL_TOKEN: ${{ secrets.MISCVERCELHOSTING }}
        run: pnpm dlx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
