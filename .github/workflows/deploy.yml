name: Deploy to Cloudflare

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Name of the prebuilt Cloudflare output artifact
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production

    steps:
      - name: Checkout trusted deployment tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: trusted-tooling
          sparse-checkout: |
            .github/deployment/package.json
            .github/deployment/pnpm-lock.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.15.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: trusted-tooling/.github/deployment/pnpm-lock.yaml

      - name: Install trusted deployment tooling
        working-directory: trusted-tooling/.github/deployment
        run: pnpm install --frozen-lockfile --prod --ignore-scripts

      - name: Download prebuilt output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: deployment/dist

      - name: Deploy prebuilt artifact
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: trusted-tooling/.github/deployment/node_modules/.bin/wrangler deploy --config deployment/dist/server/wrangler.json --name misc-astro
