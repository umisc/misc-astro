name: Deploy to Vercel

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Name of the prebuilt Vercel output artifact
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production artifact
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Checkout trusted deployment tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted-tooling
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.15.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: trusted-tooling/pnpm-lock.yaml

      - name: Install trusted deployment tooling
        working-directory: trusted-tooling
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download prebuilt output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.artifact_name }}
          path: deployment/.vercel/output

      - name: Deploy prebuilt artifact
        working-directory: deployment
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.MISCVERCELHOSTING }}
        run: ../trusted-tooling/node_modules/.bin/vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
