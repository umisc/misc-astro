name: Delete ephemeral preview database

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number whose ephemeral database should be deleted
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: preview-db-cleanup-pr-${{ github.event.pull_request.number }}${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete ephemeral preview database
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: preview
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Set up trusted Wrangler
        id: wrangler
        uses: umisc/misc-astro/.github/actions/setup-wrangler@main

      - name: Delete ephemeral preview database
        uses: umisc/misc-astro/.github/actions/preview-db@main
        with:
          wrangler: ${{ steps.wrangler.outputs.wrangler }}
          operation: delete
          pr_number: ${{ github.event.pull_request.number }}${{ inputs.pr_number }}
