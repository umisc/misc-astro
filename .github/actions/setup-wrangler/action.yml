name: Setup trusted Wrangler
description: >-
  Sets up wrangler

outputs:
  wrangler:
    description: Absolute path to the pinned Wrangler binary
    value: ${{ github.workspace }}/trusted-tooling/.github/deployment/node_modules/.bin/wrangler

runs:
  using: composite
  steps:
    - name: Checkout trusted deployment tooling
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: main
        path: trusted-tooling
        sparse-checkout: |
          .github/deployment/package.json
          .github/deployment/pnpm-lock.yaml
        sparse-checkout-cone-mode: false
        persist-credentials: false

    - name: Set up pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: 12.16.1

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26
        cache: pnpm
        cache-dependency-path: trusted-tooling/.github/deployment/pnpm-lock.yaml

    - name: Install trusted deployment tooling
      shell: bash
      working-directory: trusted-tooling/.github/deployment
      run: pnpm install --frozen-lockfile --prod --ignore-scripts
